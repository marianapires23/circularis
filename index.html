<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Detalhes & Validação do QR Code</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #0b2920;
      color: #071f18;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 26px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h2 { margin: 0 0 6px 0; font-size: 1.35rem; color: #071f18; }
    .sub { font-size: 0.88rem; color: #475569; margin-bottom: 18px; }
    .box-info {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 5px solid #16a34a;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .linha {
      border-bottom: 1px dashed rgba(22, 163, 74, 0.25);
      padding: 4px 0;
    }
    .linha:last-child { border-bottom: none; }
    .btn-confirmar {
      width: 100%;
      background: #2e7d32;
      color: #ffffff;
      border: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-confirmar:hover { background: #1b5e20; }
    .msg-ok {
      display: none;
      margin-top: 16px;
      background: #dcfce7;
      color: #14532d;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📦 Validação da Carga</h2>
    <p class="sub">Confira os dados do produto/serviço e confirme a leitura.</p>

    <div class="box-info" id="info-carga">Carregando informações...</div>

    <button class="btn-confirmar" id="btnConfirmarQR" onclick="confirmarLeituraQRCode()">
      ✅ Confirmar Leitura do QR Code (+10 pts)
    </button>

    <div class="msg-ok" id="msgOk">
      🎉 Leitura confirmada! +10 pontos somados ao score.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const idOp = params.get('id') || '-';
    const tipoOp = (params.get('type') || 'industria').toLowerCase();
    const nomeParceiro = params.get('nome') || 'Parceiro Circularis';
    const meuNome = params.get('meuNome') || '-';
    const produto = params.get('produto') || '';
    const servico = params.get('servico') || '';
    const qtd = params.get('qtd');
    const valor = params.get('valor');
    const custo = params.get('custo');
    const dist = params.get('dist');
    const dataAlvo = params.get('date') || new Date().toISOString().split('T')[0];

    const valorExibido = tipoOp === 'cooperativa'
      ? (custo ? `R$ ${Number(custo).toFixed(2)}` : '-')
      : (valor ? `R$ ${Number(valor).toFixed(2)}` : '-');

    const qtdExibida = qtd ? `${qtd}` : '-';
    const distExibida = dist ? `${dist} km` : '-';
    const itemLabel = tipoOp === 'cooperativa' ? 'Serviço' : 'Produto';
    const itemValor = tipoOp === 'cooperativa' ? (servico || 'Coleta e Triagem') : (produto || 'Resíduo Industrial');

    document.getElementById('info-carga').innerHTML = `
      <div class="linha"><strong>Parceiro:</strong> ${nomeParceiro}</div>
      <div class="linha"><strong>Solicitante:</strong> ${meuNome}</div>
      <div class="linha"><strong>${itemLabel}:</strong> ${itemValor}</div>
      ${tipoOp !== 'cooperativa' ? `<div class="linha"><strong>Quantidade:</strong> ${qtdExibida}</div>` : ''}
      <div class="linha"><strong>${tipoOp === 'cooperativa' ? 'Custo Estimado' : 'Orçamento'}:</strong> ${valorExibido}</div>
      <div class="linha"><strong>Distância:</strong> ${distExibida}</div>
      <div class="linha"><strong>Data:</strong> ${dataAlvo}</div>
      <div class="linha"><strong>ID da Operação:</strong> ${idOp}</div>
    `;

    function confirmarLeituraQRCode() {
      const btn = document.getElementById('btnConfirmarQR');
      btn.disabled = true;
      btn.innerText = 'Confirmando...';

      const payload = {
        evento: 'ENTREGA_CONFIRMADA',
        id: idOp,
        empId: params.get('empId') || '',
        nome: params.get('nome') || '',
        meuNome: params.get('meuNome') || '',
        produto: params.get('produto') || '',
        servico: params.get('servico') || '',
        tipo: tipoOp,
        userId: params.get('user') || '',
        date: dataAlvo,
        pontosAdd: 10,
        ts: String(Date.now())
      };

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
        }
      } catch (_) {}

      try {
        const bc = new BroadcastChannel('circularis_sync');
        bc.postMessage(payload);
      } catch (_) {}

      document.getElementById('msgOk').style.display = 'block';

      const returnUrl = params.get('return_url');
      if (returnUrl) {
        const volta = new URLSearchParams({
          confirmado_id: payload.id,
          empId: payload.empId,
          nome: payload.nome,
          meuNome: payload.meuNome,
          produto: payload.produto,
          servico: payload.servico,
          type: payload.tipo,
          user: payload.userId,
          date: payload.date,
          pontos_add: '10',
          ts: payload.ts
        });

        setTimeout(() => {
          window.location.href = `${returnUrl}?${volta.toString()}`;
        }, 700);
      } else {
        btn.innerText = '✅ Confirmado (+10 pts)';
      }
    }
  </script>
</body>
</html>
