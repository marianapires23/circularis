<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Detalhes da Carga</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #0b2920;
      color: #071f18;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 26px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h2 { margin: 0 0 6px 0; font-size: 1.35rem; color: #071f18; }
    .sub { font-size: 0.88rem; color: #475569; margin-bottom: 18px; }
    .box-info {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 5px solid #16a34a;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .linha {
      border-bottom: 1px dashed rgba(22, 163, 74, 0.25);
      padding: 5px 0;
    }
    .linha:last-child { border-bottom: none; }
    .btn-acao {
      width: 100%;
      background: #0f4033;
      color: #ffffff;
      border: none;
      padding: 13px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-acao:hover { background: #071f18; }
    .status-box {
      display: none;
      margin-top: 14px;
      background: #e0f2fe;
      color: #0369a1;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📦 Detalhes da Carga</h2>
    <p class="sub">Informações da operação vinculada ao QR Code.</p>

    <div class="box-info" id="info-carga">Carregando informações...</div>

    <button class="btn-acao" id="btnConcluirVisualizacao" onclick="concluirConsulta()">
      🔍 Registrar Conferência da Carga
    </button>

    <div class="status-box" id="statusBox">
      ✔️ Carga conferida no dispositivo. Confirme os +10 pts na tela do sistema.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const tipoOp = (params.get('type') || 'industria').toLowerCase();
    const nomeParceiro = params.get('nome') || 'Parceiro Circularis';
    const meuNome = params.get('meuNome') || '-';
    const produto = params.get('produto') || '';
    const servico = params.get('servico') || '';
    const qtd = params.get('qtd');
    const valor = params.get('valor');
    const custo = params.get('custo');
    const dist = params.get('dist');
    const avaliacaoRaw = params.get('avaliacao');
    const dataAlvo = params.get('date') || new Date().toISOString().split('T')[0];

    function formatarMoeda(v) {
      const num = Number(v);
      if (v === null || v === undefined || v === '' || Number.isNaN(num)) return '-';
      return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatarDataBR(dataStr) {
      if (!dataStr) return '-';
      const partes = String(dataStr).split('-');
      if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
      return dataStr;
    }

    const valorExibido = tipoOp === 'cooperativa'
      ? formatarMoeda(custo)
      : formatarMoeda(valor);

    const qtdExibida = qtd ? `${qtd}` : '-';
    const distExibida = dist ? `${dist} km` : '-';
    const avaliacaoExibida = (avaliacaoRaw !== null && avaliacaoRaw !== '' && !Number.isNaN(Number(avaliacaoRaw)))
      ? `${Number(avaliacaoRaw).toFixed(1)}`
      : '-';

    const itemIcone = tipoOp === 'cooperativa' ? '♻️' : '📦';
    const itemLabel = tipoOp === 'cooperativa' ? 'Serviço' : 'Produto';
    const itemValor = tipoOp === 'cooperativa'
      ? (servico || 'Coleta e Triagem')
      : (produto || 'Resíduo Industrial');

    document.getElementById('info-carga').innerHTML = `
      <div class="linha">🏢 <strong>Parceiro:</strong> ${nomeParceiro}</div>
      <div class="linha">👤 <strong>Solicitante:</strong> ${meuNome}</div>
      <div class="linha">${itemIcone} <strong>${itemLabel}:</strong> ${itemValor}</div>
      ${tipoOp !== 'cooperativa' ? `<div class="linha">⚖️ <strong>Quantidade:</strong> ${qtdExibida}</div>` : ''}
      <div class="linha">💰 <strong>${tipoOp === 'cooperativa' ? 'Custo Estimado' : 'Orçamento'}:</strong> ${valorExibido}</div>
      <div class="linha">📍 <strong>Distância:</strong> ${distExibida}</div>
      <div class="linha">📅 <strong>Data:</strong> ${formatarDataBR(dataAlvo)}</div>
      <div class="linha">⭐ <strong>Avaliação:</strong> ${avaliacaoExibida}</div>
    `;

    function concluirConsulta() {
      document.getElementById('statusBox').style.display = 'block';
      const btn = document.getElementById('btnConcluirVisualizacao');
      btn.innerText = '✔️ Conferência Registrada';
      btn.style.background = '#15803d';
    }
  </script>
</body>
</html>
