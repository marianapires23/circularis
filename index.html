<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Validação de Carga</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f8f5; text-align: center; padding: 40px 20px; color: #0d231a; }
    .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .btn-pontuar { background: #2e7d32; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 20px; }
    .btn-pontuar:hover { background: #1b5e20; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚚 Validação de Carga</h2>
    <p style="margin-top: 10px; color: #555;">Confirme a entrega do lote para atribuir os pontos no Ranking Circularis.</p>
    
    <button class="btn-pontuar" onclick="validarEntregaEPontuar()">
      ⭐ Confirmar Entrega e Atribuir +10 Pts Extras
    </button>
  </div>

  <script>
    function validarEntregaEPontuar() {
      // 1. Identifica qual empresa foi lida na URL (?id=0, ?id=1, etc.)
      const urlParams = new URLSearchParams(window.location.search);
      const empresaId = parseInt(urlParams.get('id')) || 0;

      // 2. Busca o histórico de pontos salvo ou cria um novo
      let pontosSalvos = JSON.parse(localStorage.getItem('pontosEmpresas')) || {};

      // 3. Adiciona +10 pontos extras para esta empresa
      const pontosAtuais = pontosSalvos[empresaId] || 0;
      pontosSalvos[empresaId] = pontosAtuais + 10;

      // 4. Salva a atualização na memória do navegador (localStorage)
      localStorage.setItem('pontosEmpresas', JSON.stringify(pontosSalvos));

      alert("✅ Carga Validada com Sucesso! +10 pontos adicionados ao Ranking.");
    }
  </script>
</body>
</html>
