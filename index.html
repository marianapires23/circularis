<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Validação do QR Code</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #0b2920;
      color: #071f18;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 26px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h2 { margin: 0 0 8px 0; font-size: 1.35rem; color: #071f18; }
    .sub { font-size: 0.88rem; color: #475569; margin-bottom: 18px; }
    .box-info {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 5px solid #16a34a;
      border-radius: 10px;
      padding: 14px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .btn-confirmar {
      width: 100%;
      background: #2e7d32;
      color: #ffffff;
      border: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-confirmar:hover { background: #1b5e20; }
    .msg-ok {
      display: none;
      margin-top: 16px;
      background: #dcfce7;
      color: #14532d;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📱 Validação de Carga</h2>
    <p class="sub">Confirme a leitura do QR Code para somar <strong>+10 pts</strong> no score atual.</p>

    <div class="box-info" id="info-carga">Carregando dados da operação...</div>

    <button class="btn-confirmar" id="btnConfirmarQR" onclick="confirmarLeituraQRCode()">
      ✅ Confirmar Leitura do QR Code (+10 pts)
    </button>

    <div class="msg-ok" id="msgOk">
      🎉 Leitura confirmada! +10 pontos enviados para o Score.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const nomeAlvo = params.get('nome') || 'Parceiro Circularis';
    const itemAlvo = params.get('produto') || params.get('servico') || 'Operação Circular';
    const dataAlvo = params.get('date') || new Date().toISOString().split('T')[0];

    document.getElementById('info-carga').innerHTML = `
      <strong>Parceiro:</strong> ${nomeAlvo}<br>
      <strong>Produto / Serviço:</strong> ${itemAlvo}<br>
      <strong>Data:</strong> ${dataAlvo}
    `;

    function confirmarLeituraQRCode() {
      const btn = document.getElementById('btnConfirmarQR');
      btn.disabled = true;
      btn.innerText = 'Confirmando...';

      const payload = {
        evento: 'ENTREGA_CONFIRMADA',
        id: params.get('id') || '',
        empId: params.get('empId') || '',
        nome: params.get('nome') || '',
        meuNome: params.get('meuNome') || '',
        produto: params.get('produto') || '',
        servico: params.get('servico') || '',
        tipo: params.get('type') || 'industria',
        userId: params.get('user') || '',
        date: dataAlvo,
        pontosAdd: 10,
        ts: String(Date.now())
      };

      // Se abriu no mesmo navegador/aba via window.opener ou BroadcastChannel
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
        }
      } catch (_) {}

      try {
        const bc = new BroadcastChannel('circularis_sync');
        bc.postMessage(payload);
      } catch (_) {}

      document.getElementById('msgOk').style.display = 'block';

      const returnUrl = params.get('return_url');
      if (returnUrl) {
        const volta = new URLSearchParams({
          confirmado_id: payload.id,
          empId: payload.empId,
          nome: payload.nome,
          meuNome: payload.meuNome,
          produto: payload.produto,
          servico: payload.servico,
          type: payload.tipo,
          user: payload.userId,
          date: payload.date,
          pontos_add: '10',
          ts: payload.ts
        });

        setTimeout(() => {
          window.location.href = `${returnUrl}?${volta.toString()}`;
        }, 700);
      } else {
        btn.innerText = '✅ Confirmado (+10 pts)';
      }
    }
  </script>
</body>
</html>
