<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circularis • Validação de Carga</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background-color: #b6d8bd;
      background-image: linear-gradient(rgba(13, 35, 26, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(13, 35, 26, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      color: #0d231a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card-validador {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid #cbe5d2;
      text-align: center;
    }

    .brand { font-size: 1.2rem; font-weight: 800; color: #0d231a; margin-bottom: 6px; }
    .badge-tipo {
      display: inline-block;
      background: #e8f5e9;
      color: #1b5e20;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .product-details-card {
      background: #f4f8f5;
      border: 1px solid #cbe5d2;
      border-radius: 10px;
      padding: 18px;
      text-align: left;
      font-size: 0.9rem;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .product-details-card p {
      border-bottom: 1px dashed #d5e6da;
      padding: 4px 0;
    }
    .product-details-card p:last-child {
      border-bottom: none;
    }

    .btn-actions { display: flex; flex-direction: column; gap: 10px; }

    .btn-success {
      width: 100%;
      background: #2e7d32;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-success:hover { background: #1b5e20; }
    .btn-success:disabled { background: #a0a0a0; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      background: #e0e0e0;
      color: #333333;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-secondary:hover { background: #d0d0d0; }
  </style>
</head>
<body>

  <div class="card-validador">
    <div class="brand">🌐 Circularis • Validação de Carga</div>
    <div class="badge-tipo" id="badge-operacao">Carregando operação...</div>

    <div class="product-details-card" id="qr-product-info">
      Carregando informações da tabela...
    </div>

    <div class="btn-actions">
      <button class="btn-success" id="btn-confirmar-pontos" onclick="validarEntregaEPontuar()">
        ✅ Confirmar Entrega e Atribuir (+10 Pts)
      </button>

      <button class="btn-secondary" onclick="voltarAoDashboard()">
        Voltar ao Dashboard
      </button>
    </div>
  </div>

  <script>
    function formatarBRL(valor) {
      const num = Number(valor);
      if (isNaN(num)) return "R$ 0,00";
      return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatarDataBR(dateParam) {
      if (!dateParam) return new Date().toLocaleDateString('pt-BR');
      const partes = dateParam.split('-');
      return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : dateParam;
    }

    async function carregarDadosDaTabela() {
      const urlParams = new URLSearchParams(window.location.search);
      const idParam = urlParams.get('id');
      const tipo = (urlParams.get('type') || 'industria').toLowerCase();
      const userId = urlParams.get('user') || localStorage.getItem('id_usu') || '';
      const dataFormatada = formatarDataBR(urlParams.get('date'));

      const container = document.getElementById('qr-product-info');
      const badge = document.getElementById('badge-operacao');
      const btnConfirmar = document.getElementById('btn-confirmar-pontos');

      if (!idParam) {
        badge.innerText = "Aviso";
        container.innerHTML = `<p>⚠️ Nenhum item selecionado. Escaneie um QR Code gerado na tabela de <strong>Indicadores Estratégicos</strong>.</p>`;
        btnConfirmar.disabled = true;
        return;
      }

      // 1. Dados base vindos diretamente dos parâmetros do QR Code (garante funcionamento mesmo no GitHub Pages/celular)
      let dadosItem = {
        id: idParam,
        nome: urlParams.get('nome') || '',
        produto: urlParams.get('produto') || '',
        categoria: urlParams.get('categoria') || '',
        quantidade: urlParams.get('qtd') || '',
        unidade: urlParams.get('unidade') || 'kg',
        precoUnitario: urlParams.get('precoUnit') || '',
        orcamentoTotal: urlParams.get('orcamento') || '',
        distanciaKm: urlParams.get('dist') || '',
        localizacao: urlParams.get('local') || '',
        taxaFixa: urlParams.get('taxaFixa') || '',
        tipoCobranca: urlParams.get('tipoCob') || '',
        custoTotal: urlParams.get('custoTotal') || ''
      };

      // 2. Se estiver rodando no servidor da aplicação (localhost), busca os dados atualizados direto do banco
      try {
        if (tipo === 'cooperativa') {
          const listaCoops = [];
          const resEmp = await fetch('/api/feed/empresas');
          if (resEmp.ok) listaCoops.push(...(await resEmp.json()));
          try {
            const resCoop = await fetch('/api/feed/cooperativas');
            if (resCoop.ok) listaCoops.push(...(await resCoop.json()));
          } catch (_) {}

          const coopBanco = listaCoops.find(c => String(c.id_usu || c.id_usuario || c.id) === String(idParam));
          if (coopBanco) {
            const taxaFixa = parseFloat(coopBanco.taxa_fixa || 0);
            const taxaServico = parseFloat(coopBanco.taxa_servico || 0);
            const tipoCob = String(coopBanco.tipo_taxa_servico || '').toLowerCase();
            const dist = parseFloat(dadosItem.distanciaKm || 10);

            let custoVar = taxaServico;
            let tipoTexto = coopBanco.tipo_taxa_servico || 'Taxa por Serviço';
            if (tipoCob.includes('produto') || tipoCob.includes('volume')) {
              custoVar = taxaServico * 50;
              tipoTexto = `Por Produto/Volume (${formatarBRL(taxaServico)} × 50 un. modelo)`;
            } else if (tipoCob.includes('distancia') || tipoCob.includes('km')) {
              custoVar = taxaServico * dist;
              tipoTexto = `Por Distância (${formatarBRL(taxaServico)}/km)`;
            } else if (tipoCob.includes('peso') || tipoCob.includes('kg')) {
              custoVar = taxaServico * 500;
              tipoTexto = `Por Peso (${formatarBRL(taxaServico)}/kg)`;
            }

            dadosItem.nome = coopBanco.nome_cooperativa || coopBanco.nome_emp || dadosItem.nome;
            dadosItem.localizacao = coopBanco.localizacao || dadosItem.localizacao;
            dadosItem.taxaFixa = taxaFixa;
            dadosItem.tipoCobranca = tipoTexto;
            dadosItem.custoTotal = taxaFixa + custoVar;
          }
        } else if (userId) {
          const resCarrinho = await fetch(`/api/carrinho?id_usu=${encodeURIComponent(userId)}`);
          if (resCarrinho.ok) {
            const itens = await resCarrinho.json();
            const itemBanco = Array.isArray(itens)
              ? itens.find(i => String(i.id_solicitacao || i.id) === String(idParam))
              : null;

            if (itemBanco) {
              const qtd = parseFloat(itemBanco.quant_solicitacao || itemBanco.peso_solicitacao || itemBanco.quantidade || 1);
              const total = parseFloat(itemBanco.orcamento || 0);
              const un = itemBanco.peso_solicitacao || itemBanco.unidade === 'Kg' ? 'kg' : 'unid';
              const pUnit = itemBanco.precoUnitario || (qtd > 0 ? total / qtd : total);

              dadosItem.nome = itemBanco.empresa || dadosItem.nome;
              dadosItem.produto = itemBanco.titulo || itemBanco.produto || itemBanco.categoria || dadosItem.produto;
              dadosItem.categoria = itemBanco.categoria || dadosItem.categoria;
              dadosItem.quantidade = qtd;
              dadosItem.unidade = un;
              dadosItem.precoUnitario = pUnit;
              dadosItem.orcamentoTotal = pUnit * qtd;
            }
          }
        }
      } catch (_) {
        // Quando aberto externamente (ex: celular via GitHub Pages), utiliza os dados da URL
      }

      // 3. Fallback no localStorage se ainda faltar algum dado
      if (tipo !== 'cooperativa' && !dadosItem.produto && userId) {
        const locais = JSON.parse(localStorage.getItem(`solicitacoesEnviadas_${userId}`) || '[]');
        const encontrado = locais.find(i => String(i.id_solicitacao || i.id) === String(idParam));
        if (encontrado) {
          dadosItem.nome = encontrado.empresa || dadosItem.nome;
          dadosItem.produto = encontrado.titulo || encontrado.produto || dadosItem.produto;
          dadosItem.categoria = encontrado.categoria || dadosItem.categoria;
          dadosItem.quantidade = encontrado.quant_solicitacao || encontrado.quantidade || 1;
          dadosItem.unidade = encontrado.unidade || 'kg';
          dadosItem.orcamentoTotal = encontrado.orcamento || 0;
          dadosItem.precoUnitario = Number(dadosItem.orcamentoTotal) / (Number(dadosItem.quantidade) || 1);
        }
      }

      // 4. Renderiza na tela exatamente os campos da tabela correspondente
      if (tipo === 'cooperativa') {
        badge.innerText = "♻️ Coleta • Cooperativa";
        btnConfirmar.innerText = "✅ Confirmar Coleta e Validar Operação";

        container.innerHTML = `
          <p>♻️ <strong>Cooperativa:</strong> ${dadosItem.nome || 'Cooperativa Parceira'}</p>
          <p>📍 <strong>Localização:</strong> ${dadosItem.localizacao || 'Não informada'}</p>
          <p>🏷️ <strong>Taxa Fixa:</strong> ${formatarBRL(dadosItem.taxaFixa)}</p>
          <p>🧾 <strong>Tipo de Cobrança:</strong> ${dadosItem.tipoCobranca || 'Taxa por Serviço'}</p>
          ${dadosItem.distanciaKm ? `<p>🚚 <strong>Distância Estimada:</strong> ${dadosItem.distanciaKm} km</p>` : ''}
          <p>💰 <strong>Custo Total Estimado:</strong> <strong style="color:#15803d;">${formatarBRL(dadosItem.custoTotal)}</strong></p>
          <p>📅 <strong>Data Agendada:</strong> ${dataFormatada}</p>
        `;
      } else {
        badge.innerText = "🏭 Entrega • Resíduo Industrial";
        const qtdFormatada = dadosItem.quantidade
          ? `${Number(dadosItem.quantidade).toLocaleString('pt-BR')} ${dadosItem.unidade}`
          : 'Não informada';

        container.innerHTML = `
          <p>🏢 <strong>Fornecedor:</strong> ${dadosItem.nome || 'Empresa Parceira'}</p>
          <p>📦 <strong>Produto / Resíduo:</strong> ${dadosItem.produto || 'Resíduo Industrial'}</p>
          ${dadosItem.categoria ? `<p>🗂️ <strong>Categoria:</strong> ${dadosItem.categoria}</p>` : ''}
          <p>⚖️ <strong>Quantidade (Escala Base):</strong> ${qtdFormatada}</p>
          <p>🏷️ <strong>Preço / ${dadosItem.unidade}:</strong> ${formatarBRL(dadosItem.precoUnitario)}</p>
          <p>💰 <strong>Orçamento Total:</strong> <strong style="color:#15803d;">${formatarBRL(dadosItem.orcamentoTotal)}</strong></p>
          ${dadosItem.distanciaKm ? `<p>🚚 <strong>Distância:</strong> ${dadosItem.distanciaKm} km</p>` : ''}
          <p>📅 <strong>Data Agendada:</strong> ${dataFormatada}</p>
        `;
      }
    }

    function validarEntregaEPontuar() {
      const urlParams = new URLSearchParams(window.location.search);
      const empresaId = String(urlParams.get('id') || '0');
      const userId = urlParams.get('user') || localStorage.getItem('id_usu') || '';
      const tipo = (urlParams.get('type') || 'industria').toLowerCase();

      const btn = document.getElementById('btn-confirmar-pontos');

      if (tipo === 'cooperativa') {
        btn.innerText = "🎉 Coleta Validada com Sucesso!";
        btn.disabled = true;
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        return;
      }

      // Salva na chave isolada da conta logada (que o metricas.html lê)
      const chavePontos = userId ? `pontosEmpresas_${userId}` : 'pontosEmpresas_anonimo';
      let pontosSalvos = JSON.parse(localStorage.getItem(chavePontos) || '{}');
      const pontosAtuais = parseInt(pontosSalvos[empresaId]) || 0;

      pontosSalvos[empresaId] = pontosAtuais + 10;
      localStorage.setItem(chavePontos, JSON.stringify(pontosSalvos));

      // Mantém compatibilidade com chave genérica
      let pontosLegado = JSON.parse(localStorage.getItem('pontosEmpresas') || '{}');
      pontosLegado[empresaId] = pontosSalvos[empresaId];
      localStorage.setItem('pontosEmpresas', JSON.stringify(pontosLegado));

      btn.innerText = `🎉 Entrega Confirmada (Total: +${pontosSalvos[empresaId]} Pts)`;
      btn.disabled = true;

      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
    }

    function voltarAoDashboard() {
      if (window.location.hostname.includes('github.io')) {
        window.history.back();
      } else {
        window.location.href = "metricas.html";
      }
    }

    window.onload = carregarDadosDaTabela;
  </script>
</body>
</html>
